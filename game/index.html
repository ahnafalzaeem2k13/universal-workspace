<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#0b2632"><link rel="icon" href="/favicon.svg"><title>SKYBOUND — The Last Signal</title></head><body><main id="app"><canvas id="game-canvas" aria-label="Three-dimensional Skybound game world"></canvas><div id="world-labels"></div><section id="hud"><header class="topbar"><div class="brand"><div class="brand-mark">◇</div><div><div class="brand-name">SKYBOUND</div><div class="brand-sub">THE LAST SIGNAL</div></div></div><div class="metrics"><div class="metric"><span class="metric-label">SHARDS</span><strong class="metric-value"><span id="shard-count">0</span> / 8</strong></div><div class="metric"><span class="metric-label">BEACONS</span><strong class="metric-value"><span id="beacon-count">0</span> / 3</strong></div><div class="metric"><span class="metric-label">TIME</span><strong class="metric-value" id="timer">00:00</strong></div></div><div class="hud-actions"><button id="sound-button" class="hud-button" type="button">SOUND ON</button><button id="pause-button" class="hud-button" type="button">Ⅱ</button></div></header><div class="objective"><div class="eyebrow">CURRENT DIRECTIVE</div><strong id="objective-text">Restore signal beacons · 0/3</strong><div class="health-row"><span class="health-label">SHIELD</span><span class="health-pips" id="health-pips"><i class="filled"></i><i class="filled"></i><i class="filled"></i></span></div></div><div id="interaction-prompt"></div><div id="toast"></div><div class="controls-hint">WASD MOVE · SPACE JUMP · SHIFT DASH · E INTERACT</div><div id="touch-controls"><div id="touch-stick"><div id="touch-knob"></div></div><div class="touch-actions"><button id="jump-button" class="touch-action" type="button">JUMP</button><button id="dash-button" class="touch-action primary" type="button">DASH</button></div></div></section><section id="state-overlay" aria-live="polite"><div class="overlay-card"><div class="overlay-kicker">SKYBOUND EXPEDITION</div><h1 id="overlay-title">PAUSED</h1><p id="overlay-text">Take a breath. The island will wait.</p><button id="overlay-action" class="primary-button" type="button">RESUME</button></div></section></main><script type="module" src="/src/main.ts"></script></body></html>
